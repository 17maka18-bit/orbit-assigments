<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Orbiting Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- მთავარი მენიუს კონტეინერი -->
  <div class="menu" style="--size: 400px; --avatar-size: 100px; --item-size: 50px; --orbit-spacing: 4em; --orbit-dur: 25s; --orbit-delay: 0s; --orbit-items: 8;">
    
    <!-- ცენტრალური ავატარი -->
    <div class="avatar">
      <span>Core</span>
    </div>

    <!-- ორბიტა და მისი ელემენტები -->
    <ul class="orbit">
      <li style="--pos: 0; --angle: calc(0 * (360deg / var(--orbit-items))); --orbit-phase: 0deg;">
        <div class="item-wrap">
          <div class="item" data-category="HTML/CSS">🌐</div>
        </div>
      </li>
      <li style="--pos: 1; --angle: calc(1 * (360deg / var(--orbit-items))); --orbit-phase: 0deg;">
        <div class="item-wrap">
          <div class="item" data-category="JavaScript">⚡</div>
        </div>
      </li>
      <li style="--pos: 2; --angle: calc(2 * (360deg / var(--orbit-items))); --orbit-phase: 0deg;">
        <div class="item-wrap">
          <div class="item" data-category="React">⚛️</div>
        </div>
      </li>
      <li style="--pos: 3; --angle: calc(3 * (360deg / var(--orbit-items))); --orbit-phase: 0deg;">
        <div class="item-wrap">
          <div class="item" data-category="Node.js">🟢</div>
        </div>
      </li>
      <li style="--pos: 4; --angle: calc(4 * (360deg / var(--orbit-items))); --orbit-phase: 0deg;">
        <div class="item-wrap">
          <div class="item" data-category="Git">🐙</div>
        </div>
      </li>
      <li style="--pos: 5; --angle: calc(5 * (360deg / var(--orbit-items))); --orbit-phase: 0deg;">
        <div class="item-wrap">
          <div class="item" data-category="Design">🎨</div>
        </div>
      </li>
      <li style="--pos: 6; --angle: calc(6 * (360deg / var(--orbit-items))); --orbit-phase: 0deg;">
        <div class="item-wrap">
          <div class="item" data-category="Database">🗄️</div>
        </div>
      </li>
      <li style="--pos: 7; --angle: calc(7 * (360deg / var(--orbit-items))); --orbit-phase: 0deg;">
        <div class="item-wrap">
          <div class="item" data-category="Security">🔒</div>
        </div>
      </li>
    </ul>

  </div>

</body>
</html>
